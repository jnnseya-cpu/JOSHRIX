# THE GATE. Until 8 Nov 2026 nothing in this repository ran on a push: 2,072
# assertions existed only when somebody remembered to run them, which is the
# same as not having them on the day it matters.
#
# Every job here is one that has already caught a real defect in this codebase:
# the audit found two HIGH advisories on live paths, the type check found the
# zod 4 breaks, and the suite found a double-credited subscription renewal.
#
# `npm ci` and not `npm install`, deliberately. On 7 Nov a routine `npm install`
# moved Playwright inside its ^ range and five browser tests failed at once, and
# it pruned @types/node so the type check could not run at all. `npm ci` installs
# exactly the lockfile and fails if package.json and the lockfile disagree, so
# that drift becomes a red build instead of a surprise.
name: gate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The version the platform runs. Node 20 is past security support, so the
      # floor is 22; see the deployment note in UPLOADING-ASSETS.md.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Exactly the lockfile, or fail. This is the determinism gate.
      - name: Install (locked)
        run: npm ci

      # Six test files drive a real browser. tests/_chromium.mjs returns
      # undefined when the image has no pre-installed Chromium, which is what
      # lets Playwright resolve the one installed here.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check (strict)
        run: npm run typecheck

      - name: Full suite
        run: npm test

      # Fails the build on a HIGH or CRITICAL advisory. Moderate and below are
      # reported without blocking, because a blocking audit that nobody can fix
      # today gets switched off, and a switched-off audit finds nothing.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Audit report (non-blocking)
        if: always()
        run: npm audit || true
