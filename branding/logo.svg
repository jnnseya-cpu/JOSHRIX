<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="JOSHRIX Studio — Create Worlds. Build Games. Own the Future.">
  <defs>
    <linearGradient id="jx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <rect width="640" height="200" rx="16" fill="#0B0B14"/>
  <!-- Hex mark -->
  <g transform="translate(64,100)">
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="url(#jx-grad)" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="url(#jx-grad)"/>
  </g>
  <!-- Wordmark -->
  <text x="130" y="102" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="6" fill="#F4F4FA">JOSHRIX</text>
  <text x="134" y="134" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="14" fill="url(#jx-grad)">STUDIO</text>
  <!-- Tagline -->
  <text x="134" y="166" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="1" fill="#9CA3B8">Create Worlds. Build Games. Own the Future.</text>
</svg>
