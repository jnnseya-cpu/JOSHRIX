<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="JOSHRIX Studio — Create Worlds. Build Games. Own the Future.">
  <defs>
    <!-- One hue, hot to cooled: a worked-metal gradient rather than a spectrum.
         The mark was violet-to-cyan, which is the single most recognisable
         AI-design tell there is. -->
    <linearGradient id="jx-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0975B"/>
      <stop offset="100%" stop-color="#C96A28"/>
    </linearGradient>
  </defs>
  <rect width="640" height="200" rx="16" fill="#0B0C0E"/>
  <!-- Hex mark -->
  <g transform="translate(64,100)">
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="url(#jx-grad)" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="url(#jx-grad)"/>
  </g>
  <!-- Wordmark. Tight, not spaced: the letterform does the work.
       Archivo is named first with a system fallback, because an SVG opened
       outside the site has no access to the hosted face. -->
  <text x="130" y="100" font-family="Archivo, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" letter-spacing="-1" fill="#ECEDEF">JOSHRIX</text>
  <text x="132" y="130" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="400" letter-spacing="7" fill="#6C7280">STUDIO</text>
  <!-- Tagline -->
  <text x="132" y="164" font-family="Archivo, system-ui, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#A5AAB4">Create Worlds. Build Games. Own the Future.</text>
</svg>
