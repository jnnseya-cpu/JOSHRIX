<script>
(function(){
  var ALLOWED = ['INDEX','PLATFORM','PRODUCT-PRINCIPLES','AGENT-ARCHITECTURE','DEVELOPER-GUIDE','APP-BUILD-SPEC','DATA-MODEL','API','MONETISATION','SECURITY','INTELLIGENCE','ROADMAP','GAP-ANALYSIS'];
  var name = (new URLSearchParams(location.search).get('d') || 'INDEX').toUpperCase().replace(/[^A-Z-]/g, '');
  if (ALLOWED.indexOf(name) === -1) name = 'INDEX';
  document.title = name.replace(/-/g, ' ') + ' — JOSHRIX Developer Spec';
  var esc = function(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); };

  /* compact markdown renderer: headings, code fences, inline styles, lists,
     tables, quotes, hr, links (.md links rewritten to stay on-site) */
  function inline(s){
    return s
      .replace(/`([^`]+)`/g, function(_, c){ return '<code>' + c + '</code>'; })
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, t, u){
        var m = u.match(/([A-Z-]+)\.md/i);
        if (m) u = 'doc.html?d=' + m[1].toUpperCase();
        var ext = /^https?:/i.test(u) ? ' target="_blank" rel="noopener"' : '';
        return '<a href="' + u + '"' + ext + '>' + t + '</a>';
      });
  }
  function render(md){
    var lines = md.split(/\r?\n/), out = [], i = 0;
    while (i < lines.length) {
      var L = lines[i];
      if (/^```/.test(L)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        continue;
      }
      if (/^\|/.test(L) && i + 1 < lines.length && /^\|[\s:|-]+\|?\s*$/.test(lines[i+1])) {
        var head = L, rows = []; i += 2;
        while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
        var cells = function(r){ return r.replace(/^\||\|$/g,'').split('|').map(function(c){ return inline(esc(c.trim())); }); };
        out.push('<div class="tblwrap"><table><thead><tr>' + cells(head).map(function(c){ return '<th>' + c + '</th>'; }).join('')
          + '</tr></thead><tbody>' + rows.map(function(r){ return '<tr>' + cells(r).map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>');
        continue;
      }
      var h = L.match(/^(#{1,4})\s+(.*)/);
      if (h) { out.push('<h' + h[1].length + '>' + inline(esc(h[2])) + '</h' + h[1].length + '>'); i++; continue; }
      if (/^\s*([-*+]|\d+\.)\s+/.test(L)) {
        var ordered = /^\s*\d+\./.test(L), items = [];
        while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
          items.push('<li>' + inline(esc(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ''))) + '</li>'); i++;
        }
        out.push((ordered ? '<ol>' : '<ul>') + items.join('') + (ordered ? '</ol>' : '</ul>'));
        continue;
      }
      if (/^>\s?/.test(L)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(inline(esc(lines[i].replace(/^>\s?/, '')))), i++;
        out.push('<blockquote><p>' + q.join('<br>') + '</p></blockquote>');
        continue;
      }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(L)) { out.push('<hr>'); i++; continue; }
      if (L.trim() === '') { i++; continue; }
      var p = [];
      while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,4}\s|```|\||>\s?|\s*([-*+]|\d+\.)\s+|\s*---+\s*$)/.test(lines[i])) p.push(lines[i++]);
      out.push('<p>' + inline(esc(p.join(' '))) + '</p>');
    }
    return out.join('\n');
  }

  fetch('specs/' + name + '.md')
    .then(function(r){ if (!r.ok) throw 0; return r.text(); })
    .then(function(md){ document.getElementById('docBody').innerHTML = render(md); })
    .catch(function(){ document.getElementById('docBody').innerHTML = '<p>Could not load this document — <a href="docs.html">back to Documentation</a>.</p>'; });
})();
</script>
