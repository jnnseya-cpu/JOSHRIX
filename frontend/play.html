<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#050508">
<link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Play — JOSHRIX Studio</title>
<meta name="description" content="Play a world forged on JOSHRIX Studio.">
<link rel="stylesheet" href="/assets/joshrix.css">
<script src="/assets/config.js"></script>
<style>
  .play-shell{max-width:1080px;margin:0 auto;padding:0 1rem}
  .play-head{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1rem;margin:1.2rem 0 .9rem}
  .play-head h1{font-size:clamp(1.2rem,3.4vw,1.8rem);margin:0;flex:1 1 auto;min-width:200px}
  .pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.28rem .7rem;border-radius:999px;border:1px solid var(--stroke-bright,#3b3b52);white-space:nowrap}
  .pill.live{color:#4ade80;border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.08)}
  .pill.review{color:#fbbf24;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.08)}
  .pill.rejected{color:#f87171;border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.08)}
  .frame-card{position:relative;border:1px solid var(--stroke,#26263a);border-radius:16px;overflow:hidden;background:#07070c;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .frame-card iframe{display:block;width:100%;height:min(72vh,640px);border:0;background:#000}
  .frame-card:fullscreen{border-radius:0}
  .frame-card:fullscreen iframe{height:100vh}
  .frame-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;min-height:320px;text-align:center;padding:2rem}
  .frame-msg p{max-width:52ch;color:var(--muted,#9d9db3)}
  .play-meta{display:flex;flex-wrap:wrap;gap:.6rem 1.4rem;align-items:center;margin:.9rem 0 2.2rem;color:var(--muted,#9d9db3);font-size:.92rem}
  .spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(124,58,237,.25);border-top-color:#7C3AED;animation:jxspin 1s linear infinite}
  @keyframes jxspin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){.spin{animation:none}}
  .foot-legal{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;padding:1.4rem 1rem 2rem;color:var(--muted,#9d9db3);font-size:.85rem}
  .foot-legal a{color:inherit}
  /* compact embed mode (?embed=1) — just the game, sized to the host iframe */
  body.embed nav, body.embed .foot-legal, body.embed .play-meta, body.embed #stars, body.embed .noise{display:none}
  body.embed .play-shell{max-width:none;padding:0}
  body.embed .play-head{margin:.45rem .6rem;gap:.4rem .7rem}
  body.embed .play-head h1{font-size:1rem}
  body.embed .frame-card{border-radius:0;border:0;box-shadow:none}
  body.embed .frame-card iframe{height:calc(100vh - 46px)}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="noise" aria-hidden="true"></div>
<nav class="jx">
  <a class="brand" href="/index.html">
    <svg viewBox="-50 -50 100 100"><defs><linearGradient id="jxG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#22D3EE"/></linearGradient></defs><polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="none" stroke="url(#jxG)" stroke-width="7" stroke-linejoin="round"/><polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="url(#jxG)"/></svg>
    <span class="word">JOSHRIX<em>STUDIO</em></span>
  </a>
  <ul class="nav-links">
    <li><a href="/arcade.html">Arcade</a></li>
    <li><a href="/marketplace.html">Marketplace</a></li>
    <li><a href="/pricing.html">Pricing</a></li>
  </ul>
  <div class="nav-right">
    <a class="btn btn-primary btn-sm" href="/studio.html">⚒ Forge Your Own</a>
  </div>
</nav>
<main class="jx play-shell">
  <div class="play-head">
    <h1 id="gTitle">Loading world…</h1>
    <span class="pill" id="gPill" hidden></span>
    <button class="btn btn-ghost btn-sm" id="btnFull" hidden>⛶ Fullscreen</button>
    <button class="btn btn-ghost btn-sm" id="btnShare" hidden>⤴ Share</button>
  </div>
  <div class="frame-card" id="frameCard">
    <div class="frame-msg" id="frameMsg"><div class="spin" aria-hidden="true"></div><p id="msgText">Summoning the game from the forge…</p></div>
  </div>
  <div class="play-meta">
    <span id="gSummary"></span>
    <span id="gPlays"></span>
    <span>Forged with AI on <a href="/index.html">JOSHRIX Studio</a> — <a href="/studio.html">create your own world</a> · <a href="/arcade.html">more games in the Arcade</a></span>
  </div>
</main>
<div class="foot-legal">
  <span>© 2026 JOSHRIX Studio</span>
  <a href="/terms.html">Terms</a>
  <a href="/privacy.html">Privacy</a>
  <a href="/refunds.html">Refunds</a>
</div>
<script>
(function(){
  var API = (window.JOSHRIX_API_BASE || '');
  var qs = new URLSearchParams(location.search);
  // id arrives via the /play/:id rewrite (?id=) or a direct /play/<id> path
  var id = qs.get('id') || (location.pathname.match(/\/play\/([A-Za-z0-9-]+)/) || [])[1] || '';
  var preview = qs.get('preview') === '1';
  if (qs.get('embed') === '1') document.body.classList.add('embed');
  var $ = function(x){ return document.getElementById(x); };
  var sid = 'ps-' + Math.random().toString(36).slice(2, 12);

  // Games run in a sandboxed, opaque-origin iframe (real isolation). That origin
  // THROWS a SecurityError on any localStorage access, which silently blanks a
  // game that touches storage; and a runtime JS error otherwise renders a blank
  // screen with no clue why. prepGameHtml injects, before the game's own script,
  // an in-memory storage shim and an on-screen error reporter so neither fails silently.
  var JX_GAME_SHIM = "<style>html,body{height:100%;margin:0}<\/style><script>(function(){try{window.localStorage.getItem('_jx');}catch(e){var mk=function(){var m={};return{getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];},clear:function(){m={};},key:function(i){return Object.keys(m)[i]||null;},get length(){return Object.keys(m).length;}};};try{Object.defineProperty(window,'localStorage',{value:mk(),configurable:true});}catch(_){}try{Object.defineProperty(window,'sessionStorage',{value:mk(),configurable:true});}catch(_){}}var shown=false;function overlay(msg){if(shown)return;shown=true;var d=document.createElement('div');d.id='__jxerr';d.setAttribute('style','position:fixed;left:0;right:0;bottom:0;z-index:2147483647;font:12px/1.5 system-ui,sans-serif;background:rgba(20,6,6,.96);color:#fca5a5;padding:10px 14px;border-top:2px solid #ef4444;max-height:55%;overflow:auto;white-space:pre-wrap;word-break:break-word');d.textContent='\\u26a0 '+msg;(document.body||document.documentElement).appendChild(d);}window.addEventListener('error',function(e){overlay('Runtime error: '+(e.message||'Script error')+(e.lineno?(' (line '+e.lineno+')'):''));});window.addEventListener('unhandledrejection',function(e){overlay('Unhandled promise rejection: '+((e.reason&&(e.reason.message||e.reason))||'unknown'));});var deadStartArmed=false;document.addEventListener('click',function(ev){if(deadStartArmed)return;var el=ev.target&&ev.target.closest?ev.target.closest('button,[role=button],input,a,div,span'):null;if(!el)return;var t=((el.textContent||el.value||'')+'').trim().toLowerCase();if(t.length>48||!/start|play|begin|adventure|commencer|jouer|go!/.test(t))return;var cover=null,n=el;while(n&&n!==document.body){var r=n.getBoundingClientRect?n.getBoundingClientRect():null;if(r&&r.width>=innerWidth*0.8&&r.height>=innerHeight*0.55)cover=n;n=n.parentElement;}if(!cover)return;deadStartArmed=true;setTimeout(function(){deadStartArmed=false;var cs=getComputedStyle(cover),r2=cover.getBoundingClientRect();if(cs.display==='none'||cs.visibility==='hidden'||r2.height<innerHeight*0.5)return;['keydown','keyup'].forEach(function(type){[' ','Enter'].forEach(function(k){var e2=new KeyboardEvent(type,{key:k,code:k===' '?'Space':'Enter',bubbles:true});document.dispatchEvent(e2);window.dispatchEvent(e2);});});setTimeout(function(){var cs3=getComputedStyle(cover),r3=cover.getBoundingClientRect();if(cs3.display!=='none'&&r3.height>innerHeight*0.5){cover.style.transition='opacity .3s';cover.style.opacity='0';setTimeout(function(){cover.style.display='none';},320);}},600);},900);},true);function diag(){var cs=document.getElementsByTagName('canvas'),big=null,area=-1;for(var i=0;i<cs.length;i++){var a=cs[i].width*cs[i].height;if(a>area){area=a;big=cs[i];}}if(!cs.length){overlay('This build drew no <canvas> \\u2014 nothing to render.');return;}if(big.width===0||big.height===0||big.clientWidth===0||big.clientHeight===0){overlay('Game canvas has no size (drawing '+big.width+'\\u00d7'+big.height+', shown '+big.clientWidth+'\\u00d7'+big.clientHeight+').');}}if(document.readyState==='complete')setTimeout(diag,2500);else window.addEventListener('load',function(){setTimeout(diag,2500);});})();<\/script>";
  function prepGameHtml(html){
    if (!html) return html;
    var i = html.search(/<head[^>]*>/i);
    if (i !== -1) { var end = html.indexOf('>', i) + 1; return html.slice(0, end) + JX_GAME_SHIM + html.slice(end); }
    var h = html.search(/<html[^>]*>/i);
    if (h !== -1) { var e2 = html.indexOf('>', h) + 1; return html.slice(0, e2) + JX_GAME_SHIM + html.slice(e2); }
    return JX_GAME_SHIM + html;
  }

  function track(event, props){
    try {
      fetch(API + '/api/telemetry', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ events: [{ event: event, ts: Date.now(), sessionId: sid, gameId: id || undefined, props: props || {} }] }) });
    } catch(e){}
  }
  function showMsg(text, spinning){
    $('frameMsg').innerHTML = (spinning ? '<div class="spin" aria-hidden="true"></div>' : '') + '<p>' + text + '</p>' +
      '<a class="btn btn-primary btn-sm" href="/studio.html">⚒ Forge your own world</a>';
  }
  function pill(cls, label){ var p = $('gPill'); p.hidden = false; p.className = 'pill ' + cls; p.textContent = label; }

  if (!id) { $('gTitle').textContent = 'No game selected'; showMsg('This link is missing a game id. Head to the Studio and forge one!', false); return; }

  var pw = qs.get('w') || '';
  fetch(API + '/api/game-html?id=' + encodeURIComponent(id) + (preview ? '&preview=1' : '') + (pw ? '&w=' + encodeURIComponent(pw) : ''))
    .then(function(r){ return r.json().then(function(j){ return { ok: r.ok, status: r.status, j: j }; }); })
    .then(function(res){
      var g = res.j || {};
      if (!res.ok) {
        $('gTitle').textContent = res.status === 404 ? 'World not found' : 'World unavailable';
        showMsg(g.error || 'This game could not be loaded right now.', false);
        return;
      }
      document.title = (g.title || 'Play') + ' — JOSHRIX Studio';
      $('gTitle').textContent = g.title || 'Untitled world';
      if (g.summary) $('gSummary').textContent = g.summary;
      if (typeof g.plays === 'number' && g.status === 'approved') $('gPlays').textContent = '▶ ' + g.plays.toLocaleString() + ' plays';

      if (g.status === 'approved') pill('live', '● Live');
      else if (g.status === 'pending_review') pill('review', preview ? '◐ Preview — in review' : '◐ In review');
      else pill('rejected', '✕ Not approved');

      if (g.html) {
        var f = document.createElement('iframe');
        f.setAttribute('sandbox', 'allow-scripts allow-pointer-lock allow-forms');
        f.setAttribute('title', g.title || 'JOSHRIX game');
        f.setAttribute('allow', 'autoplay; fullscreen');
        f.srcdoc = prepGameHtml(g.html);
        $('frameCard').innerHTML = '';
        $('frameCard').appendChild(f);
        var fsBtn = $('btnFull');
        fsBtn.hidden = false;
        fsBtn.addEventListener('click', function(){
          var card = $('frameCard');
          if (document.fullscreenElement) { document.exitFullscreen(); return; }
          (card.requestFullscreen || card.webkitRequestFullscreen || function(){}).call(card);
        });
        document.addEventListener('fullscreenchange', function(){
          fsBtn.textContent = document.fullscreenElement ? '✕ Exit Fullscreen' : '⛶ Fullscreen';
        });
        track('play.session_start', { status: g.status, preview: preview });
      } else if (g.status === 'pending_review') {
        showMsg('This world is in moderation review. It goes live at this link the moment it\'s approved — check back soon.', false);
      } else {
        showMsg('This world was not approved for public play.', false);
      }

      var share = $('btnShare');
      share.hidden = false;
      share.addEventListener('click', function(){
        var url = location.origin + '/play/' + id;
        (navigator.share ? navigator.share({ title: g.title || 'JOSHRIX game', url: url }).catch(function(){}) :
          navigator.clipboard.writeText(url).then(function(){ share.textContent = '✓ Link copied'; setTimeout(function(){ share.textContent = '⤴ Share'; }, 1600); }));
        track('share.link_copied', {});
      });
    })
    .catch(function(){
      $('gTitle').textContent = 'Connection problem';
      showMsg('Could not reach the JOSHRIX servers. Check your connection and refresh.', false);
    });
})();
</script>
<script src="/assets/site.js"></script>
</body>
</html>
